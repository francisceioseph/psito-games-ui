name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: The generated translations match the ARB files
        run: flutter gen-l10n && git diff --exit-code -- 'lib/l10n/*.dart'
      - name: Test
        run: flutter test

  # Os jogos usam uma tag deste repositório (ref: v1.x.y no pubspec deles).
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish the release
        run: >-
          npx --yes
          -p semantic-release@24.2.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
